<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sunflower Surprise — Transparent Cutout Style 🌻</title>
  <style>
    :root{
      --bg:#081022;
      --panel: rgba(11,18,32,0.6);
      --accent:#ffd54a;
      --muted: rgba(255,255,255,0.08);
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial;background:
      radial-gradient(1000px 400px at 10% 20%, rgba(255,200,80,0.03), transparent 8%),
      linear-gradient(180deg,#061026 0%, #081022 60%);
      color:#fff;overflow:hidden}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:1100px;background:var(--panel);border-radius:14px;padding:20px 22px;box-shadow:0 12px 40px rgba(2,6,23,.6);backdrop-filter: blur(8px)}
    header{display:flex;align-items:center;gap:12px}
    h1{margin:0;font-size:22px}
    p.lead{margin:6px 0 14px;opacity:.9;font-size:14px}

    .stage{position:relative;height:520px;border-radius:12px;overflow:hidden;background:
      linear-gradient(180deg, rgba(255,255,255,0.02), transparent 30%);display:flex;align-items:center;justify-content:center}
    /* decorative soft glow behind stage */
    .stage::before{
      content:"";position:absolute;left:15%;top:-10%;width:70%;height:90%;background:
      radial-gradient(closest-side, rgba(255,215,100,0.06), transparent 40%);pointer-events:none;
    }

    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
    button{background:linear-gradient(180deg,#1f2937,#111827);border:0;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600}
    button.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06)}
    .muted{opacity:.85;font-size:13px;margin-left:8px}

    /* floating cutout bouquets (like PNG stickers) */
    .cutout{
      position:absolute;
      transform-origin:center;
      transition:transform .35s ease, opacity .9s ease;
      will-change:transform, opacity;
      filter: drop-shadow(0 18px 30px rgba(3,8,18,0.6)) saturate(1.02);
      cursor:pointer;
    }
    .cutout:hover{transform:translateY(-6px) scale(1.04) rotate(-2deg); z-index:999}

    /* small bloom effect when hovered */
    .cutout .glow {
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;
      width:120%;height:120%;border-radius:50%;opacity:0;transition:opacity .28s ease;
      background: radial-gradient(closest-side, rgba(255,220,80,0.14), transparent 40%);
      mix-blend-mode: screen;
    }
    .cutout:hover .glow{opacity:1}

    /* flying animation class */
    .fly {
      transition: transform 1.4s ease-in, opacity 1.4s ease-in;
    }

    /* overlay note */
    .overlay-note{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,0.66);backdrop-filter:blur(4px)}
    .note-card{background:#fff;color:#07101a;padding:22px;border-radius:12px;max-width:520px;text-align:center;box-shadow:0 18px 40px rgba(2,6,23,0.6)}

    /* small bottom controls for image removal tuning */
    .tune{display:flex;align-items:center;gap:10px;margin-left:8px;color:#ddd}
    input[type=range]{accent-color: #ffbf00}

    /* responsive tweaks */
    @media (max-width:640px){
      .stage{height:420px}
      h1{font-size:18px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <h1>For You, Suraiya Saleem 🌻</h1>
      </header>
      <p class="lead">You're my sunflower and I love you soooo much.</p>

      <div class="stage" id="stage">
        <!-- hidden original image used to source the cutout -->
        <img id="sourceImg" alt="source bouquet" style="display:none" crossorigin="anonymous"
             src="./sunflower.jpg">

        <!-- optional message box -->
        <div style="position:absolute;left:22px;top:18px;background:linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));padding:12px 14px;border-radius:10px;">
          <strong style="display:block">Hey love ❤️</strong>
          <span style="font-size:13px;opacity:.9">I made this for you,, you deserve banquets of sunflowers everydayyy. </span>
        </div>
      </div>

      <div class="controls">
        <button id="scatter">Scatter Bouquets</button>
        <button id="more" class="secondary">Add 5 More</button>
        <button id="clear" class="secondary">Clear</button>
        <button id="gift" class="secondary">Show a Note</button>

        <div class="tune">
          <label for="threshold" style="font-size:13px">Background removal threshold</label>
          <input id="threshold" type="range" min="10" max="160" value="60">
          <span id="thVal" style="width:38px;text-align:center;font-size:13px">60</span>
        </div>

        <div class="muted">Tip: increase threshold if the photo's background is similar to flowers.</div>
      </div>

    </div>
  </div>

  <script>
    // PARAMETERS
    const SOURCE = document.getElementById('sourceImg');
    const stage = document.getElementById('stage');
    const thresholdInput = document.getElementById('threshold');
    const thVal = document.getElementById('thVal');

    // We'll create a processed image dataURL (with alpha) from SOURCE.
    // The algorithm: sample average color from corners -> make nearby colors transparent.
    let processedDataURL = null;
    let processing = false;

    thresholdInput.addEventListener('input', ()=> {
      thVal.textContent = thresholdInput.value;
      if(!processing) processSourceImage(+thresholdInput.value);
    });

    SOURCE.addEventListener('load', ()=> processSourceImage(+thresholdInput.value));
    SOURCE.addEventListener('error', ()=> {
      alert('Could not load the source image. If the image is blocked by CORS, try downloading it and set the <img> src to a local file named sunflower.jpg in the same folder.');
    });

    // utility: distance between colors
    function colorDist(r1,g1,b1, r2,g2,b2){
      // simple Euclidean
      const dr = r1-r2, dg = g1-g2, db = b1-b2;
      return Math.sqrt(dr*dr + dg*dg + db*db);
    }

    async function processSourceImage(threshold = 60){
      // guard
      if(!SOURCE.complete || SOURCE.naturalWidth === 0) return;
      processing = true;

      // draw to canvas scaled down (speed) but keep decent resolution
      const W = SOURCE.naturalWidth;
      const H = SOURCE.naturalHeight;
      const scale = Math.max(1, Math.min(1.0, 1200 / Math.max(W,H))); // scale if huge
      const cw = Math.round(W * scale);
      const ch = Math.round(H * scale);

      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(SOURCE, 0, 0, cw, ch);

      // sample corners to estimate background color
      function sampleCorner(x,y, size=8){
        const sx = Math.min(Math.max(0, x), cw-1);
        const sy = Math.min(Math.max(0, y), ch-1);
        const data = ctx.getImageData(Math.max(0,sx-size/2), Math.max(0,sy-size/2), Math.min(size,cw), Math.min(size,ch)).data;
        let r=0,g=0,b=0, n=0;
        for(let i=0;i<data.length;i+=4){
          r += data[i]; g += data[i+1]; b += data[i+2]; n++;
        }
        return [Math.round(r/n), Math.round(g/n), Math.round(b/n)];
      }

      const c1 = sampleCorner(0,0);
      const c2 = sampleCorner(cw-1,0);
      const c3 = sampleCorner(0,ch-1);
      const c4 = sampleCorner(cw-1,ch-1);
      const bg = [
        Math.round((c1[0]+c2[0]+c3[0]+c4[0])/4),
        Math.round((c1[1]+c2[1]+c3[1]+c4[1])/4),
        Math.round((c1[2]+c2[2]+c3[2]+c4[2])/4)
      ];

      // process pixels
      const img = ctx.getImageData(0,0,cw,ch);
      const data = img.data;
      // Optionally compute luminance to avoid removing dark seed areas
      for(let i=0;i<data.length;i+=4){
        const r = data[i], g = data[i+1], b = data[i+2];
        const dist = colorDist(r,g,b, bg[0],bg[1],bg[2]);
        // Also protect pixels that are strongly yellow/orange (likely sunflower)
        const hueProtect = (r > 160 && g > 90 && b < 120); // rough yellow/orange detection
        if(dist < threshold && !hueProtect){
          data[i+3] = 0; // make transparent
        } else {
          // optionally slightly increase alpha for near-threshold to smooth edges
          // no change for now
        }
      }
      ctx.putImageData(img,0,0);

      // create a softened alpha edge by drawing the canvas onto another with slight blur (to avoid jagged edges)
      // We'll create an offscreen canvas to apply blur using CSS filter via <img> trick:
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = cw;
      finalCanvas.height = ch;
      const fctx = finalCanvas.getContext('2d');

      // draw the processed image as a temporary image element to make use of ctx.filter
      fctx.clearRect(0,0,cw,ch);
      // Put as image
      const tempImg = new Image();
      tempImg.src = canvas.toDataURL('image/png');
      await new Promise(res => { tempImg.onload = res; tempImg.onerror = res; });

      // apply small blur to smooth edges while preserving overall detail
      fctx.filter = 'blur(0.8px)';
      fctx.drawImage(tempImg, 0, 0, cw, ch);
      fctx.filter = 'none';

      // final dataURL
      processedDataURL = finalCanvas.toDataURL('image/png');
      processing = false;
      // enable UI if needed
    }

    // Create a cutout DOM element at normalized coordinates with a given scale
    function createCutout(normX, normY, baseSize=160){
      if(!processedDataURL) {
        // fallback: use original image styled as rectangle if processing not ready
        return createSimpleImg(normX, normY, baseSize);
      }
      const el = document.createElement('div');
      el.className = 'cutout';
      const img = new Image();
      img.src = processedDataURL;
      img.style.display = 'block';
      img.style.maxWidth = 'none';
      // set size proportional to baseSize
      const scaleFactor = (baseSize / Math.max(img.width || 600, img.height || 600));
      // We'll wait until image loads to size/position
      img.onload = ()=> {
        const naturalW = img.naturalWidth;
        const naturalH = img.naturalHeight;
        // determine display size maintaining aspect ratio, base width = baseSize.. scaled randomly
        const width = baseSize * (0.85 + Math.random()*1.6);
        const height = Math.round(width * (naturalH / naturalW));
        img.style.width = width + 'px';
        img.style.height = height + 'px';

        // set container sizing
        el.style.width = width + 'px';
        el.style.height = height + 'px';
        el.style.left = `calc(${(normX*100).toFixed(2)}% - ${width/2}px)`;
        el.style.top  = `calc(${(normY*100).toFixed(2)}% - ${height/2}px)`;
        // random rotation
        const rot = (Math.random()*28 - 14);
        el.style.transform = `translateZ(0) rotate(${rot}deg) scale(${0.9 + Math.random()*0.3})`;
        // slight entrance animation
        el.style.opacity = '0';
        requestAnimationFrame(()=> {
          el.style.transition = 'opacity .6s ease, transform .9s cubic-bezier(.2,.9,.2,1)';
          el.style.opacity = '1';
        });
      };

      // glow element
      const glow = document.createElement('div');
      glow.className = 'glow';
      el.appendChild(glow);
      el.appendChild(img);

      // interactions
      el.addEventListener('mouseenter', ()=> el.classList.add('hover'));
      el.addEventListener('mouseleave', ()=> el.classList.remove('hover'));

      // click sends flying up
      el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        flyUp(el);
      });

      stage.appendChild(el);
      return el;
    }

    // fallback: simple rectangle image (if processing not ready)
    function createSimpleImg(normX, normY, baseSize=160){
      const el = document.createElement('div');
      el.className = 'cutout';
      const img = new Image();
      img.src = SOURCE.src;
      img.style.width = baseSize + 'px';
      img.style.height = 'auto';
      el.style.width = baseSize + 'px';
      el.style.height = 'auto';
      el.style.left = `calc(${(normX*100).toFixed(2)}% - ${baseSize/2}px)`;
      el.style.top  = `calc(${(normY*100).toFixed(2)}% - ${baseSize/2}px)`;
      el.appendChild(img);
      stage.appendChild(el);
      el.addEventListener('click', (ev)=>{ ev.stopPropagation(); flyUp(el); });
      return el;
    }

    function flyUp(el){
      el.classList.add('fly');
      const current = el.style.transform || '';
      // translate upward and fade
      el.style.transform = current + ' translateY(-260px) rotate(-8deg) scale(0.88)';
      el.style.opacity = '0';
      setTimeout(()=> { if(el.parentNode) el.parentNode.removeChild(el); }, 1500);
    }

    function clearAll(){
      const nodes = stage.querySelectorAll('.cutout');
      nodes.forEach(n=> n.remove());
    }

    function scatter(count=12){
      const padding = 0.12;
      for(let i=0;i<count;i++){
        const nx = Math.random()*(1-2*padding)+padding;
        const ny = Math.random()*(1-2*padding)+padding;
        createCutout(nx, ny, 160 + Math.random()*120);
      }
    }

    // Buttons wiring
    document.getElementById('scatter').addEventListener('click', ()=> scatter(14));
    document.getElementById('more').addEventListener('click', ()=> scatter(5));
    document.getElementById('clear').addEventListener('click', ()=> clearAll());

    // stage click adds a bouquet at click
    stage.addEventListener('click', (ev)=>{
      const rect = stage.getBoundingClientRect();
      const nx = (ev.clientX - rect.left) / rect.width;
      const ny = (ev.clientY - rect.top) / rect.height;
      createCutout(Math.min(Math.max(nx,0.06),0.94), Math.min(Math.max(ny,0.06),0.94), 160 + Math.random()*100);
    });

    // gift note
    document.getElementById('gift').addEventListener('click', ()=>{
      const overlay = document.createElement('div');
      overlay.className = 'overlay-note';
      const box = document.createElement('div');
      box.className = 'note-card';
      box.innerHTML = `<h3 style="margin:0 0 8px">A little note for you 💌</h3>
        <p style="margin:0 0 12px">You make my world brighter — like these sunflowers. I love you more than any words can say.</p>`;
      const close = document.createElement('button');
      close.textContent = 'Close';
      close.style.marginTop = '8px';
      close.style.padding = '8px 12px';
      close.style.borderRadius = '8px';
      close.style.border = '0';
      close.style.cursor = 'pointer';
      close.addEventListener('click', ()=> overlay.remove());
      box.appendChild(close);
      overlay.appendChild(box);
      stage.appendChild(overlay);
    });

    // initial processing and scatter
    (async function init(){
      thVal.textContent = thresholdInput.value;
      // Wait for source to load (or trigger manual processing)
      if(SOURCE.complete && SOURCE.naturalWidth !== 0){
        await processSourceImage(+thresholdInput.value);
        // scatter a few cutouts on load
        scatter(8);
      } else {
        // if image blocked by CORS or not loaded, user will be alerted by error handler
        SOURCE.addEventListener('load', async ()=> {
          await processSourceImage(+thresholdInput.value);
          scatter(8);
        });
      }
    })();

    // Offer a download of the processed cutout (for testing)
    // (not shown in UI, but developer can call window.downloadProcessed())
    window.downloadProcessed = function(){
      if(!processedDataURL){ alert('Not ready'); return; }
      const a = document.createElement('a');
      a.href = processedDataURL;
      a.download = 'sunflower-cutout.png';
      a.click();
    };
  </script>
</body>
</html>
